name: waystone-platform-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: waystone-postgres
    restart: no
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_DEFAULT_NAME}
      SERVICE_DB_NAME: ${SERVICE_DB_NAME}
      SERVICE_DB_USER: ${SERVICE_DB_USER}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
      SERVICE_TEST_DB_NAME: ${SERVICE_TEST_DB_NAME}
      SERVICE_TEST_DB_USER: ${SERVICE_TEST_DB_USER}
      SERVICE_TEST_DB_PASSWORD: ${SERVICE_TEST_DB_PASSWORD}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      WAYSTONE_API_CLIENT_ID: ${KC_API_CLIENT_ID}
      WAYSTONE_APP_CLIENT_ID: ${KC_APP_CLIENT_ID}
      WAYSTONE_APP_WEB_REDIRECT_URI: ${KC_APP_WEB_REDIRECT_URI}
      WAYSTONE_APP_WEB_ORIGIN: ${KC_APP_WEB_ORIGIN}
      WAYSTONE_APP_MOBILE_REDIRECT_URI: ${KC_APP_MOBILE_REDIRECT_URI}
      SERVICE_SHADOW_DB_NAME: ${SERVICE_SHADOW_DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../services/db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_ADMIN_USER} -d ${DB_DEFAULT_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION}
    container_name: waystone-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      WAYSTONE_BACKEND_CLIENT_ID: ${KC_SERVICE_CLIENT_ID}
      WAYSTONE_BACKEND_CLIENT_SECRET: ${KC_SERVICE_CLIENT_SECRET}
    ports:
      - "${KC_PORT}:8080"
    volumes:
      - ../services/keycloak/waystone-realm.json:/opt/keycloak/data/import/waystone-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  object-storage:
    image: chrislusf/seaweedfs:${OBJECT_STORAGE_VERSION}
    container_name: waystone-object-storage
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET}
    ports:
      - "${OBJECT_STORAGE_PORT}:8333"
    volumes:
      - object_storage_data:/data
    networks:
      - backend-network

volumes:
  postgres_data:
    name: waystone-postgres-data
  object_storage_data:
    name: waystone-object-storage-data

networks:
  backend-network:
    name: waystone-backend-network
    driver: bridge
